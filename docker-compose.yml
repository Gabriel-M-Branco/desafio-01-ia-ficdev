services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: central_atendimento_gov_mt
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - EXECUTION_MODE=${EXECUTION_MODE:-auto}
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./resultados:/app/resultados
      - ./dados/processados:/app/dados/processados
